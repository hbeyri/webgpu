name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run for the older one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (${{ matrix.preset }})
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja and ccache
        run: brew install ninja ccache

      # The values the caches below depend on
      - name: Read Dawn and compiler versions
        id: versions
        run: |
          dawn=$(sed -n 's/^set(DAWN_VERSION "\([0-9]*\)".*/\1/p' CMakeLists.txt)
          test -n "$dawn" || { echo "DAWN_VERSION not found in CMakeLists.txt"; exit 1; }
          echo "dawn=$dawn" >> "$GITHUB_OUTPUT"
          echo "compiler=$(c++ --version | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # The Dawn source and its dependencies (about 1 GB), downloaded by the
      # first configure. It only changes with the Dawn version or the patches.
      - name: Restore Dawn source
        id: dawn-src
        uses: actions/cache/restore@v6
        with:
          path: build/_shared
          key: dawn-src-${{ runner.os }}-${{ steps.versions.outputs.dawn }}-${{ hashFiles('cmake/patches/**', 'webgpu/dawn/**') }}

      # Compiled object files. Building Dawn is most of the build time, and with
      # this only the files that changed since the last run are compiled again.
      - name: Restore compiler cache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ matrix.preset }}-${{ steps.versions.outputs.compiler }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.preset }}-${{ steps.versions.outputs.compiler }}-

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Save Dawn source
        if: steps.dawn-src.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/_shared
          key: ${{ steps.dawn-src.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # The unit tests, written in the source files in src/. They don't create
      # a WebGPU device, so they don't need a GPU on the runner.
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats

      # Saved even when the build fails, so the next run doesn't start from zero
      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ matrix.preset }}-${{ steps.versions.outputs.compiler }}-${{ github.sha }}

  # The WebAssembly build. Dawn is not built here: the browser provides WebGPU.
  web:
    name: Web (release)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja and Emscripten
        run: brew install ninja emscripten

      - name: Configure
        run: emcmake cmake --preset web-release

      - name: Build
        run: cmake --build --preset web-release

      # GitHub Pages serves index.html at the site's address, so the page is
      # renamed. It loads webgpuapp.js, which loads webgpuapp.wasm.
      - name: Collect the files for the web page
        run: |
          mkdir site
          cp build/web-release/webgpuapp.html site/index.html
          cp build/web-release/webgpuapp.js build/web-release/webgpuapp.wasm site/

      - name: Upload the web page
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Publish the web build to GitHub Pages, only from main and only when every
  # build above passed. The repository's Pages source must be "GitHub Actions"
  # (Settings > Pages).
  deploy:
    name: Publish web page
    if: github.ref == 'refs/heads/main'
    needs: [macos, web]
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
